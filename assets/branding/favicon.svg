<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Pi Tie mark: pi's rounded-square π mark wrapped in a necktie. -->
  <defs>
    <linearGradient id="tieGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- Necktie: knot + body -->
  <g>
    <!-- Body -->
    <path fill="url(#tieGrad)" d="
      M 78 76
      C 60 92, 44 118, 44 148
      C 44 196, 96 226, 128 250
      C 160 226, 212 196, 212 148
      C 212 118, 196 92, 178 76
      Z
    "/>
    <!-- Knot -->
    <path fill="url(#tieGrad)" d="
      M 96 40
      L 160 40
      L 172 88
      C 152 100, 104 100, 84 88
      Z
    "/>
    <!-- Knot highlight -->
    <path fill="#ffffff" opacity="0.14" d="
      M 104 44
      L 128 44
      L 138 84
      C 126 92, 114 92, 102 84
      Z
    "/>
    <!-- Body stripe -->
    <path fill="#ffffff" opacity="0.10" d="M 108 96 L 148 96 L 128 244 Z"/>
  </g>

  <!-- Pi mark: rounded square + white π, centered in the tie body -->
  <g transform="translate(128 150) translate(-32 -32)">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="#0f0f1a" opacity="0.92"/>
    <rect x="14" y="17" width="36" height="6.5" rx="3.25" fill="#ffffff"/>
    <rect x="17.5" y="23.5" width="6.5" height="25" rx="3.25" fill="#ffffff"/>
    <rect x="40" y="23.5" width="6.5" height="25" rx="3.25" fill="#ffffff"/>
  </g>
</svg>
